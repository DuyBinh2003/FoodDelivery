# Single-Layer Gateway CORS & Security Headers
# Deduplicates upstream CORS headers so NestJS app.enableCors() never causes duplicate header rejections.
proxy_hide_header Access-Control-Allow-Origin;
proxy_hide_header Access-Control-Allow-Credentials;
proxy_hide_header Access-Control-Allow-Methods;
proxy_hide_header Access-Control-Allow-Headers;
proxy_hide_header Access-Control-Expose-Headers;

add_header Access-Control-Allow-Origin $cors_origin always;
add_header Access-Control-Allow-Credentials "true" always;
add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, X-Trace-Id, Idempotency-Key, Cache-Control" always;
add_header Access-Control-Expose-Headers "X-Trace-Id, traceparent" always;
add_header Vary "Origin" always;

# Distributed Tracing & Security Headers
add_header X-Trace-Id $trace_id always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Fast-respond CORS Preflight without hitting rate limits or backend upstreams
if ($request_method = OPTIONS) {
    return 204;
}
