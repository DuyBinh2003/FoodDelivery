# Shared HTTP-level maps and rate limiting zones for NGINX Gateway
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=payment_limit:10m rate=15r/s;
limit_req_status 429;

# WebSocket Upgrade Map
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# APM & Distributed Tracing Trace-ID Mapping
map $http_x_trace_id $trace_id {
    default $http_x_trace_id;
    ""      "fd-tr-$request_id";
}

# Dynamic CORS Allowlist Map (Same-Origin default + Multi-Origin Dev/LAN Fallback)
map $http_origin $cors_origin {
    default "";
    "~^https?://localhost(:[0-9]+)?$" $http_origin;
    "~^https?://127\.0\.0\.1(:[0-9]+)?$" $http_origin;
    "~^https?://\[::1\](:[0-9]+)?$" $http_origin;
    "~^https?://(192\.168\.|10\.|172\.(1[6-9]|2[0-9]|3[0-1])\.)[0-9.]+(:[0-9]+)?$" $http_origin;
}
