# Single Source of Truth Routing Table for Unified NGINX Gateway (:8080)
# -----------------------------------------------------------------------
# Onboarding a new microservice:
#   1. Add upstream in upstreams.docker.conf & upstreams.local.conf (next free 400x/500x port)
#   2. Add a `location ~ ^/api/<prefix>(/|$)` block below (and optional `/ws/<name>/socket.io`)

# 1. Gateway Healthcheck (Exact Match)
location = /health {
    default_type application/json;
    return 200 '{"status":"UP","service":"api-gateway","port":8080}';
}

# 2. Protect Internal & Sandbox Simulation Endpoints from External Access
location ~ ^/(api/)?(.*/)?internal(/|$) {
    deny all;
    return 403;
}

location ~ ^/(api/)?payment/webhooks/simulate(/|$) {
    deny all;
    return 403;
}

# 3. Next.js Reserved App Router API Endpoints (must bypass Backend strip)
location = /api/health {
    proxy_pass http://frontend_app;
    include /etc/nginx/gateway/snippets/proxy-common.conf;
}

location = /api/routing {
    proxy_pass http://frontend_app;
    include /etc/nginx/gateway/snippets/proxy-common.conf;
}

# 4. REST API Microservices (/api/<resource>/* -> strip /api/ prefix)
location ~ ^/api/auth(/|$) {
    limit_req zone=auth_limit burst=10 nodelay;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://user_service;
    include /etc/nginx/gateway/snippets/proxy-common.conf;
}

location ~ ^/api/(users|loyalty)(/|$) {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://user_service;
    include /etc/nginx/gateway/snippets/proxy-common.conf;
}

location ~ ^/api/(admin|disputes)(/|$) {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://admin_service;
    include /etc/nginx/gateway/snippets/proxy-common.conf;
}

location ~ ^/api/restaurants(/|$) {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://restaurant_service;
    include /etc/nginx/gateway/snippets/proxy-common.conf;
}

location ~ ^/api/(orders|vouchers)(/|$) {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://order_service;
    include /etc/nginx/gateway/snippets/proxy-common.conf;
}

location ~ ^/api/delivery(/|$) {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://delivery_service;
    include /etc/nginx/gateway/snippets/proxy-common.conf;
}

location ~ ^/api/search(/|$) {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://search_service;
    include /etc/nginx/gateway/snippets/proxy-common.conf;
}

location ~ ^/api/(wallets|payment|ledger)(/|$) {
    limit_req zone=payment_limit burst=10 nodelay;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://payment_service;
    include /etc/nginx/gateway/snippets/proxy-common.conf;
}

# AI Chat Service (SSE Streaming Enabled)
location ~ ^/api/ai(/|$) {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://ai_service;
    include /etc/nginx/gateway/snippets/proxy-common.conf;
    proxy_set_header Connection '';
    chunked_transfer_encoding off;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 86400s;
}

# 5. Isolated WebSocket Service Gateways (/ws/<service>/socket.io)
location ^~ /ws/user/socket.io {
    proxy_pass http://user_service;
    include /etc/nginx/gateway/snippets/ws-common.conf;
}

location ^~ /ws/admin/socket.io {
    proxy_pass http://admin_service;
    include /etc/nginx/gateway/snippets/ws-common.conf;
}

location ^~ /ws/delivery/socket.io {
    proxy_pass http://delivery_service;
    include /etc/nginx/gateway/snippets/ws-common.conf;
}

# 6. Next.js HMR WebSocket (Hybrid Dev support through NGINX :8080)
location ^~ /_next/webpack-hmr {
    proxy_pass http://frontend_app;
    include /etc/nginx/gateway/snippets/ws-common.conf;
}

# 7. Catch-All Frontend Next.js App Router (Same-Origin UI Pages & Assets)
location / {
    proxy_pass http://frontend_app;
    include /etc/nginx/gateway/snippets/proxy-common.conf;
}
