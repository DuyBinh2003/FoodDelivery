# Docker Full-Stack Upstreams (Frontend + Microservices Port Band)
upstream frontend_app {
    server frontend:3000;
}

upstream user_service {
    server user-service:4001;
}

upstream admin_service {
    server admin-service:4002;
}

upstream restaurant_service {
    server restaurant-service:4003;
}

upstream order_service {
    server order-service:4004;
}

upstream delivery_service {
    ip_hash;
    server delivery-service:4005;
}

upstream search_service {
    server search-service:4006;
}

upstream payment_service {
    server payment-service:4007;
}

upstream ai_service {
    server ai-service:5001;
}
