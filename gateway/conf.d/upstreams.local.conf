# Hybrid Local Dev Upstreams (Host processes accessed via host.docker.internal)
upstream frontend_app {
    server host.docker.internal:3000;
}

upstream user_service {
    server host.docker.internal:4001;
}

upstream admin_service {
    server host.docker.internal:4002;
}

upstream restaurant_service {
    server host.docker.internal:4003;
}

upstream order_service {
    server host.docker.internal:4004;
}

upstream delivery_service {
    ip_hash;
    server host.docker.internal:4005;
}

upstream search_service {
    server host.docker.internal:4006;
}

upstream payment_service {
    server host.docker.internal:4007;
}

upstream ai_service {
    server host.docker.internal:5001;
}
