events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/json;
    sendfile      on;
    keepalive_timeout 65;

    include /etc/nginx/gateway/conf.d/shared-http.conf;
    include /etc/nginx/gateway/conf.d/upstreams.local.conf;

    server {
        listen 8080;
        server_name localhost _;

        limit_req zone=general_limit burst=50 nodelay;
        proxy_read_timeout 60s;
        include /etc/nginx/gateway/snippets/cors-headers.conf;
        include /etc/nginx/gateway/conf.d/routes.conf;
    }
}
