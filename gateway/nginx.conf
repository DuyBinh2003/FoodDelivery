events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/json;

    sendfile        on;
    keepalive_timeout  65;

    # Rate Limiting Zones: 10m stores ~160,000 IP states
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=payment_limit:10m rate=15r/s;
    limit_req_status 429;

    # WebSocket Upgrade Map
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Setup upstreams for each microservice
    upstream user_service {
        server user-service:3001;
    }

    upstream admin_service {
        server admin-service:3002;
    }

    upstream restaurant_service {
        server restaurant-service:3003;
    }

    upstream order_service {
        server order-service:3004;
    }

    upstream delivery_service {
        server delivery-service:3005;
    }

    upstream search_service {
        server search-service:3006;
    }

    upstream payment_service {
        server payment-service:3007;
    }

    # API Gateway Server
    server {
        listen 3000;
        server_name localhost;

        # Apply general rate limit by default
        limit_req zone=general_limit burst=30 nodelay;

        # Protect Internal APIs from external access
        location ~ ^/.*/internal/ {
            deny all;
            return 403;
        }
        location ~ ^/internal/ {
            deny all;
            return 403;
        }

        # User Service Routes
        location /users/ {
            proxy_pass http://user_service/users/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://user_service/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Admin Service Routes
        location /admin/ {
            proxy_pass http://admin_service/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Restaurant Service Routes
        location /restaurants/ {
            proxy_pass http://restaurant_service/restaurants/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Order Service Routes
        location /orders/ {
            proxy_pass http://order_service/orders/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Delivery Service Routes
        location /delivery/ {
            proxy_pass http://delivery_service/delivery/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Search Service Routes
        location /search/ {
            proxy_pass http://search_service/search/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Payment Service Routes
        location /wallets/ {
            limit_req zone=payment_limit burst=10 nodelay;
            proxy_pass http://payment_service/wallets/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /payment/ {
            limit_req zone=payment_limit burst=10 nodelay;
            proxy_pass http://payment_service/payment/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /ledger/ {
            limit_req zone=payment_limit burst=10 nodelay;
            proxy_pass http://payment_service/ledger/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # WebSocket Socket.io Gateway Proxy
        location /socket.io/ {
            proxy_pass http://delivery_service/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Healthcheck for API Gateway
        location /health {
            default_type application/json;
            return 200 '{"status":"UP", "service":"api-gateway"}';
        }
    }
}
