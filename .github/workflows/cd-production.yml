name: "🏭 CD — Deploy to Production (ECS)"

on:
  push:
    branches: ["main"]

# Chỉ 1 deploy tại một thời điểm
concurrency:
  group: cd-production
  cancel-in-progress: false  # Production: KHÔNG cancel deploy đang chạy

env:
  AWS_REGION: ap-southeast-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-southeast-1.amazonaws.com
  ECS_CLUSTER: food-delivery-production-cluster

jobs:
  # ==========================================
  # 1. CI Gate — Phải xanh trước khi deploy
  # ==========================================
  ci-backend:
    name: "✅ Backend CI Gate"
    uses: ./.github/workflows/ci-backend.yml

  ci-frontend:
    name: "✅ Frontend CI Gate"
    uses: ./.github/workflows/ci-frontend.yml

  # ==========================================
  # 2. Build & Push Docker Images lên ECR
  # ==========================================
  build-and-push:
    name: "🐳 Build & Push Images"
    needs: [ci-backend, ci-frontend]
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
      full-sha: ${{ steps.meta.outputs.sha }}

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔑 Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔐 Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🏷️ Set Image Tag
        id: meta
        run: |
          SHORT_SHA=$(echo $GITHUB_SHA | head -c7)
          echo "tag=prod-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "sha=$GITHUB_SHA" >> $GITHUB_OUTPUT

      - name: 🏗️ Build & Push user-service
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          build-args: APP_NAME=user-service
          tags: |
            ${{ env.ECR_REGISTRY }}/fd-user-service:${{ steps.meta.outputs.tag }}
            ${{ env.ECR_REGISTRY }}/fd-user-service:latest
          cache-from: type=gha,scope=prod-user-service
          cache-to: type=gha,mode=max,scope=prod-user-service

      - name: 🏗️ Build & Push admin-service
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          build-args: APP_NAME=admin-service
          tags: |
            ${{ env.ECR_REGISTRY }}/fd-admin-service:${{ steps.meta.outputs.tag }}
            ${{ env.ECR_REGISTRY }}/fd-admin-service:latest
          cache-from: type=gha,scope=prod-admin-service
          cache-to: type=gha,mode=max,scope=prod-admin-service

      - name: 🏗️ Build & Push restaurant-service
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          build-args: APP_NAME=restaurant-service
          tags: |
            ${{ env.ECR_REGISTRY }}/fd-restaurant-service:${{ steps.meta.outputs.tag }}
            ${{ env.ECR_REGISTRY }}/fd-restaurant-service:latest
          cache-from: type=gha,scope=prod-restaurant-service
          cache-to: type=gha,mode=max,scope=prod-restaurant-service

      - name: 🏗️ Build & Push order-service
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          build-args: APP_NAME=order-service
          tags: |
            ${{ env.ECR_REGISTRY }}/fd-order-service:${{ steps.meta.outputs.tag }}
            ${{ env.ECR_REGISTRY }}/fd-order-service:latest
          cache-from: type=gha,scope=prod-order-service
          cache-to: type=gha,mode=max,scope=prod-order-service

      - name: 🏗️ Build & Push delivery-service
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          build-args: APP_NAME=delivery-service
          tags: |
            ${{ env.ECR_REGISTRY }}/fd-delivery-service:${{ steps.meta.outputs.tag }}
            ${{ env.ECR_REGISTRY }}/fd-delivery-service:latest
          cache-from: type=gha,scope=prod-delivery-service
          cache-to: type=gha,mode=max,scope=prod-delivery-service

      - name: 🏗️ Build & Push search-service
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          build-args: APP_NAME=search-service
          tags: |
            ${{ env.ECR_REGISTRY }}/fd-search-service:${{ steps.meta.outputs.tag }}
            ${{ env.ECR_REGISTRY }}/fd-search-service:latest
          cache-from: type=gha,scope=prod-search-service
          cache-to: type=gha,mode=max,scope=prod-search-service

      - name: 🏗️ Build & Push payment-service
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          build-args: APP_NAME=payment-service
          tags: |
            ${{ env.ECR_REGISTRY }}/fd-payment-service:${{ steps.meta.outputs.tag }}
            ${{ env.ECR_REGISTRY }}/fd-payment-service:latest
          cache-from: type=gha,scope=prod-payment-service
          cache-to: type=gha,mode=max,scope=prod-payment-service

      - name: 🏗️ Build & Push ai-python
        uses: docker/build-push-action@v6
        with:
          context: ./ai-python
          file: ./ai-python/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/fd-ai-python:${{ steps.meta.outputs.tag }}
            ${{ env.ECR_REGISTRY }}/fd-ai-python:latest
          cache-from: type=gha,scope=prod-ai-python
          cache-to: type=gha,mode=max,scope=prod-ai-python

      - name: 🏗️ Build & Push ai-service
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          build-args: APP_NAME=ai-service
          tags: |
            ${{ env.ECR_REGISTRY }}/fd-ai-service:${{ steps.meta.outputs.tag }}
            ${{ env.ECR_REGISTRY }}/fd-ai-service:latest
          cache-from: type=gha,scope=prod-ai-service
          cache-to: type=gha,mode=max,scope=prod-ai-service

      - name: 🏗️ Build & Push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.PROD_NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_BACKEND_URL=${{ secrets.PROD_NEXT_PUBLIC_BACKEND_URL }}
            NEXT_PUBLIC_USER_SERVICE_URL=${{ secrets.PROD_USER_SERVICE_URL }}
            NEXT_PUBLIC_ADMIN_SERVICE_URL=${{ secrets.PROD_ADMIN_SERVICE_URL }}
            NEXT_PUBLIC_RESTAURANT_SERVICE_URL=${{ secrets.PROD_RESTAURANT_SERVICE_URL }}
            NEXT_PUBLIC_ORDER_SERVICE_URL=${{ secrets.PROD_ORDER_SERVICE_URL }}
            NEXT_PUBLIC_DELIVERY_SERVICE_URL=${{ secrets.PROD_DELIVERY_SERVICE_URL }}
            NEXT_PUBLIC_SEARCH_SERVICE_URL=${{ secrets.PROD_SEARCH_SERVICE_URL }}
            NEXT_PUBLIC_PAYMENT_SERVICE_URL=${{ secrets.PROD_PAYMENT_SERVICE_URL }}
            NEXT_PUBLIC_AI_SERVICE_URL=${{ secrets.PROD_AI_SERVICE_URL }}
            NEXT_PUBLIC_ADMIN_WS_URL=${{ secrets.PROD_ADMIN_WS_URL }}
            NEXT_PUBLIC_USER_WS_URL=${{ secrets.PROD_USER_WS_URL }}
          tags: |
            ${{ env.ECR_REGISTRY }}/fd-frontend:${{ steps.meta.outputs.tag }}
            ${{ env.ECR_REGISTRY }}/fd-frontend:latest
          cache-from: type=gha,scope=prod-frontend
          cache-to: type=gha,mode=max,scope=prod-frontend

  # ==========================================
  # 3. Run DB Migrations
  # ==========================================
  migrate:
    name: "🗃️ Run DB Migrations"
    needs: [build-and-push]
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔑 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ⚙️ Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "./backend/package-lock.json"

      - name: 📥 Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: 🗃️ Run All Migrations (Production)
        working-directory: ./backend
        run: npm run migrate:all
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          POSTGRES_USER: ${{ secrets.PROD_POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.PROD_POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.PROD_POSTGRES_DB }}

  # ==========================================
  # 4. Deploy tất cả services lên ECS Production
  # ==========================================
  deploy:
    name: "🏭 Deploy to ECS Production"
    needs: [build-and-push, migrate]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ secrets.PROD_APP_URL }}

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔑 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔄 Deploy user-service → ECS Production
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: .aws/ecs/production/user-service-task-def.json
          service: fd-prod-user-service
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          image-container-definitions: |
            [{"name":"user-service","imageUri":"${{ env.ECR_REGISTRY }}/fd-user-service:${{ needs.build-and-push.outputs.image-tag }}"}]

      - name: 🔄 Deploy admin-service → ECS Production
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: .aws/ecs/production/admin-service-task-def.json
          service: fd-prod-admin-service
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          image-container-definitions: |
            [{"name":"admin-service","imageUri":"${{ env.ECR_REGISTRY }}/fd-admin-service:${{ needs.build-and-push.outputs.image-tag }}"}]

      - name: 🔄 Deploy restaurant-service → ECS Production
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: .aws/ecs/production/restaurant-service-task-def.json
          service: fd-prod-restaurant-service
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          image-container-definitions: |
            [{"name":"restaurant-service","imageUri":"${{ env.ECR_REGISTRY }}/fd-restaurant-service:${{ needs.build-and-push.outputs.image-tag }}"}]

      - name: 🔄 Deploy order-service → ECS Production
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: .aws/ecs/production/order-service-task-def.json
          service: fd-prod-order-service
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          image-container-definitions: |
            [{"name":"order-service","imageUri":"${{ env.ECR_REGISTRY }}/fd-order-service:${{ needs.build-and-push.outputs.image-tag }}"}]

      - name: 🔄 Deploy delivery-service → ECS Production
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: .aws/ecs/production/delivery-service-task-def.json
          service: fd-prod-delivery-service
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          image-container-definitions: |
            [{"name":"delivery-service","imageUri":"${{ env.ECR_REGISTRY }}/fd-delivery-service:${{ needs.build-and-push.outputs.image-tag }}"}]

      - name: 🔄 Deploy search-service → ECS Production
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: .aws/ecs/production/search-service-task-def.json
          service: fd-prod-search-service
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          image-container-definitions: |
            [{"name":"search-service","imageUri":"${{ env.ECR_REGISTRY }}/fd-search-service:${{ needs.build-and-push.outputs.image-tag }}"}]

      - name: 🔄 Deploy payment-service → ECS Production
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: .aws/ecs/production/payment-service-task-def.json
          service: fd-prod-payment-service
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          image-container-definitions: |
            [{"name":"payment-service","imageUri":"${{ env.ECR_REGISTRY }}/fd-payment-service:${{ needs.build-and-push.outputs.image-tag }}"}]

      - name: 🔄 Deploy ai-python → ECS Production
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: .aws/ecs/production/ai-python-task-def.json
          service: fd-prod-ai-python
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          image-container-definitions: |
            [{"name":"ai-python","imageUri":"${{ env.ECR_REGISTRY }}/fd-ai-python:${{ needs.build-and-push.outputs.image-tag }}"}]

      - name: 🔄 Deploy ai-service → ECS Production
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: .aws/ecs/production/ai-service-task-def.json
          service: fd-prod-ai-service
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          image-container-definitions: |
            [{"name":"ai-service","imageUri":"${{ env.ECR_REGISTRY }}/fd-ai-service:${{ needs.build-and-push.outputs.image-tag }}"}]

      - name: 🔄 Deploy frontend → ECS Production
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: .aws/ecs/production/frontend-task-def.json
          service: fd-prod-frontend
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          image-container-definitions: |
            [{"name":"frontend","imageUri":"${{ env.ECR_REGISTRY }}/fd-frontend:${{ needs.build-and-push.outputs.image-tag }}"}]

      - name: ✅ Production Deploy Thành Công
        run: |
          echo "🎉 Deploy PRODUCTION thành công!"
          echo "📦 Image tag: ${{ needs.build-and-push.outputs.image-tag }}"
          echo "🌐 URL: ${{ secrets.PROD_APP_URL }}"
          echo "🔖 Commit SHA: ${{ needs.build-and-push.outputs.full-sha }}"

      - name: 🏷️ Tạo GitHub Release Tag
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ needs.build-and-push.outputs.image-tag }}';
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${tag}`,
              sha: context.sha,
            });
