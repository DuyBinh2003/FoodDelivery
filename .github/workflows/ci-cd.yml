name: "⚠️ Legacy CI/CD Pipeline (Deprecated)"

# File này được giữ lại để tương thích ngược.
# Pipeline thực tế đã được tách thành 4 files riêng biệt:
#   - ci-backend.yml  : CI cho Backend (lint, test, build)
#   - ci-frontend.yml : CI cho Frontend (lint, build)
#   - cd-staging.yml  : CD deploy lên Staging (branch develop)
#   - cd-production.yml : CD deploy lên Production (branch main)

on:
  workflow_dispatch:
    inputs:
      message:
        description: "Thông báo"
        required: false
        default: "File này đã deprecated. Dùng các workflow mới."

jobs:
  info:
    name: "📋 Thông báo Deprecated"
    runs-on: ubuntu-latest
    steps:
      - name: Show Info
        run: |
          echo "⚠️  File ci-cd.yml đã được deprecated."
          echo ""
          echo "Các workflow mới:"
          echo "  - ci-backend.yml   → Lint, TypeCheck, Test, Build backend"
          echo "  - ci-frontend.yml  → Lint, Build frontend"
          echo "  - cd-staging.yml   → Auto-deploy khi push vào branch 'develop'"
          echo "  - cd-production.yml → Auto-deploy khi push vào branch 'main'"
