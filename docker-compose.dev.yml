services:
  # Database Service
  db:
    image: postgres:15-alpine
    container_name: food_delivery_db
    ports:
      - "5432:5432"
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  # Cache Service
  redis:
    image: redis:7-alpine
    container_name: food_delivery_redis
    ports:
      - "6379:6379"
    env_file: .env
    volumes:
      - redisdata:/data
    restart: unless-stopped

  # Search Engine
  elasticsearch:
    image: elasticsearch:8.10.2
    container_name: food_delivery_elasticsearch
    env_file: .env
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    restart: unless-stopped

  # LocalStack for AWS local simulation (SQS)
  localstack:
    image: localstack/localstack
    container_name: food_delivery_localstack
    ports:
      - "4566:4566"
    env_file: .env
    volumes:
      - localstackdata:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/init-sqs.sh
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  localstackdata:
  esdata:
