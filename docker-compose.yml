services:
  # ==========================================
  # DATABASE
  # ==========================================
  db:
    image: pgvector/pgvector:pg15
    container_name: food_delivery_db
    ports:
      - "5432:5432"
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # CACHE
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: food_delivery_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped

  # ==========================================
  # SEARCH ENGINE
  # ==========================================
  elasticsearch:
    image: elasticsearch:8.10.2
    container_name: food_delivery_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    restart: unless-stopped

  # ==========================================
  # AWS LOCAL SIMULATION (SNS + SQS + S3)
  # ==========================================
  localstack:
    image: localstack/localstack
    container_name: food_delivery_localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs,sns,s3
      - DEFAULT_REGION=ap-southeast-1
      - EXTRA_CORS_ALLOWED_ORIGINS=https://app.localstack.cloud,http://localhost:8080,http://localhost:3000,http://localhost:3100
      - EXTRA_CORS_ALLOWED_HEADERS=*
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN}
    volumes:
      - localstackdata:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/init-aws.sh
    restart: unless-stopped

  # ==========================================
  # FRONTEND APP (Behind Unified NGINX :8080)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_GATEWAY_URL: /api
        NEXT_PUBLIC_INTERNAL_API_GATEWAY_URL: http://api-gateway:8080/api
        NEXT_PUBLIC_API_URL: http://localhost:8080/api
        NEXT_PUBLIC_BACKEND_URL: http://localhost:8080
        NEXT_PUBLIC_USER_SERVICE_URL: http://user-service:4001
        NEXT_PUBLIC_ADMIN_SERVICE_URL: http://admin-service:4002
        NEXT_PUBLIC_RESTAURANT_SERVICE_URL: http://restaurant-service:4003
        NEXT_PUBLIC_ORDER_SERVICE_URL: http://order-service:4004
        NEXT_PUBLIC_DELIVERY_SERVICE_URL: http://delivery-service:4005
        NEXT_PUBLIC_SEARCH_SERVICE_URL: http://search-service:4006
        NEXT_PUBLIC_PAYMENT_SERVICE_URL: http://payment-service:4007
        NEXT_PUBLIC_AI_SERVICE_URL: http://ai-service:5001
        NEXT_PUBLIC_ADMIN_WS_URL: /admin
        NEXT_PUBLIC_ADMIN_WS_PATH: /ws/admin/socket.io
        NEXT_PUBLIC_USER_WS_URL: /user
        NEXT_PUBLIC_USER_WS_PATH: /ws/user/socket.io
        NEXT_PUBLIC_DELIVERY_WS_URL: /delivery
        NEXT_PUBLIC_DELIVERY_WS_PATH: /ws/delivery/socket.io
        NEXT_PUBLIC_S3_ASSETS_URL: http://localhost:4566/food-delivery-assets
    container_name: fd_frontend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - INTERNAL_API_GATEWAY_URL=http://api-gateway:8080/api
      - NEXT_PUBLIC_API_GATEWAY_URL=/api
      - NEXT_PUBLIC_INTERNAL_API_GATEWAY_URL=http://api-gateway:8080/api
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:8080
      - NEXT_PUBLIC_USER_SERVICE_URL=http://user-service:4001
      - NEXT_PUBLIC_ADMIN_SERVICE_URL=http://admin-service:4002
      - NEXT_PUBLIC_RESTAURANT_SERVICE_URL=http://restaurant-service:4003
      - NEXT_PUBLIC_ORDER_SERVICE_URL=http://order-service:4004
      - NEXT_PUBLIC_DELIVERY_SERVICE_URL=http://delivery-service:4005
      - NEXT_PUBLIC_SEARCH_SERVICE_URL=http://search-service:4006
      - NEXT_PUBLIC_PAYMENT_SERVICE_URL=http://payment-service:4007
      - NEXT_PUBLIC_AI_SERVICE_URL=http://ai-service:5001
    depends_on:
      user-service:
        condition: service_started
      restaurant-service:
        condition: service_started
      order-service:
        condition: service_started
      search-service:
        condition: service_started
    restart: unless-stopped

  # ==========================================
  # UNIFIED NGINX GATEWAY (Public Entry :8080)
  # ==========================================
  api-gateway:
    image: nginx:alpine
    container_name: fd_api_gateway
    ports:
      - "8080:8080"
    volumes:
      - ./gateway:/etc/nginx/gateway:ro
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_started
      user-service:
        condition: service_started
      admin-service:
        condition: service_started
      restaurant-service:
        condition: service_started
      order-service:
        condition: service_started
      search-service:
        condition: service_started
      payment-service:
        condition: service_started
      delivery-service:
        condition: service_started
      ai-service:
        condition: service_started
    restart: unless-stopped

  # ==========================================
  # CORE MICROSERVICES (Port Band 4001-4099)
  # ==========================================
  user-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        APP_NAME: user-service
    container_name: fd_user_service
    ports:
      - "4001:4001"
    env_file: ./backend/.env
    environment:
      - PORT=4001
      - USER_SERVICE_PORT=4001
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-password}@db:5432/food_delivery
      - REDIS_HOST=redis
      - REDIS_URL=redis://redis:6379
      - SQS_ENDPOINT=http://localstack:4566
      - SNS_ENDPOINT=http://localstack:4566
      - S3_ENDPOINT=http://localstack:4566
      - CORS_ALLOWED_ORIGINS=http://localhost:8080,http://localhost:3000,http://localhost:3100
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  admin-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        APP_NAME: admin-service
    container_name: fd_admin_service
    ports:
      - "4002:4002"
    env_file: ./backend/.env
    environment:
      - PORT=4002
      - ADMIN_SERVICE_PORT=4002
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-password}@db:5432/food_delivery
      - REDIS_HOST=redis
      - REDIS_URL=redis://redis:6379
      - SQS_ENDPOINT=http://localstack:4566
      - SNS_ENDPOINT=http://localstack:4566
      - USER_SERVICE_URL=http://user-service:4001
      - RESTAURANT_SERVICE_URL=http://restaurant-service:4003
      - ORDER_SERVICE_URL=http://order-service:4004
      - DELIVERY_SERVICE_URL=http://delivery-service:4005
      - PAYMENT_SERVICE_URL=http://payment-service:4007
      - CORS_ALLOWED_ORIGINS=http://localhost:8080,http://localhost:3000,http://localhost:3100
    depends_on:
      db:
        condition: service_healthy
      localstack:
        condition: service_started
    restart: unless-stopped

  restaurant-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        APP_NAME: restaurant-service
    container_name: fd_restaurant_service
    ports:
      - "4003:4003"
    env_file: ./backend/.env
    environment:
      - PORT=4003
      - RESTAURANT_SERVICE_PORT=4003
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-password}@db:5432/food_delivery
      - REDIS_HOST=redis
      - REDIS_URL=redis://redis:6379
      - ELASTICSEARCH_NODE=http://elasticsearch:9200
      - S3_ENDPOINT=http://localstack:4566
      - CORS_ALLOWED_ORIGINS=http://localhost:8080,http://localhost:3000,http://localhost:3100
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  order-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        APP_NAME: order-service
    container_name: fd_order_service
    ports:
      - "4004:4004"
    env_file: ./backend/.env
    environment:
      - PORT=4004
      - ORDER_SERVICE_PORT=4004
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-password}@db:5432/food_delivery
      - REDIS_HOST=redis
      - REDIS_URL=redis://redis:6379
      - SQS_ENDPOINT=http://localstack:4566
      - SNS_ENDPOINT=http://localstack:4566
      - USER_SERVICE_URL=http://user-service:4001
      - RESTAURANT_SERVICE_URL=http://restaurant-service:4003
      - SEARCH_SERVICE_URL=http://search-service:4006
      - PAYMENT_SERVICE_URL=http://payment-service:4007
      - CORS_ALLOWED_ORIGINS=http://localhost:8080,http://localhost:3000,http://localhost:3100
    depends_on:
      db:
        condition: service_healthy
      localstack:
        condition: service_started
    restart: unless-stopped

  delivery-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        APP_NAME: delivery-service
    container_name: fd_delivery_service
    ports:
      - "4005:4005"
    env_file: ./backend/.env
    environment:
      - PORT=4005
      - DELIVERY_SERVICE_PORT=4005
      - REDIS_HOST=redis
      - REDIS_URL=redis://redis:6379
      - SQS_ENDPOINT=http://localstack:4566
      - SNS_ENDPOINT=http://localstack:4566
      - S3_ENDPOINT=http://localstack:4566
      - ORDER_SERVICE_URL=http://order-service:4004
      - CORS_ALLOWED_ORIGINS=http://localhost:8080,http://localhost:3000,http://localhost:3100
    depends_on:
      localstack:
        condition: service_started
    restart: unless-stopped

  search-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        APP_NAME: search-service
    container_name: fd_search_service
    ports:
      - "4006:4006"
    env_file: ./backend/.env
    environment:
      - PORT=4006
      - SEARCH_SERVICE_PORT=4006
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-password}@db:5432/food_delivery
      - ELASTICSEARCH_NODE=http://elasticsearch:9200
      - RESTAURANT_SERVICE_URL=http://restaurant-service:4003
      - CORS_ALLOWED_ORIGINS=http://localhost:8080,http://localhost:3000,http://localhost:3100
    depends_on:
      db:
        condition: service_healthy
      elasticsearch:
        condition: service_started
    restart: unless-stopped

  payment-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        APP_NAME: payment-service
    container_name: fd_payment_service
    ports:
      - "4007:4007"
    env_file: ./backend/.env
    environment:
      - PORT=4007
      - PAYMENT_SERVICE_PORT=4007
      - PUBLIC_GATEWAY_URL=http://localhost:8080/api
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-password}@db:5432/food_delivery
      - REDIS_HOST=redis
      - REDIS_URL=redis://redis:6379
      - CORS_ALLOWED_ORIGINS=http://localhost:8080,http://localhost:3000,http://localhost:3100
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  # ==========================================
  # AI MICROSERVICES (Port Band 5001-5099)
  # ==========================================
  ai-python:
    build:
      context: ./ai-python
      dockerfile: Dockerfile
    container_name: fd_ai_python
    ports:
      - "5002:5002"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file: ./ai-python/.env
    environment:
      - AI_PYTHON_PORT=5002
      - POSTGRES_URI=postgresql://postgres:${POSTGRES_PASSWORD:-password}@db:5432/food_delivery
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - ORDER_SERVICE_URL=http://order-service:4004
      - USER_SERVICE_URL=http://user-service:4001
      - CORS_ALLOWED_ORIGINS=http://localhost:8080,http://localhost:3000,http://ai-service:5001
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      elasticsearch:
        condition: service_started
    restart: unless-stopped

  ai-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        APP_NAME: ai-service
    container_name: fd_ai_service
    ports:
      - "5001:5001"
    env_file: ./backend/.env
    environment:
      - PORT=5001
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-password}@db:5432/food_delivery
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      - AI_SERVICE_PORT=5001
      - LANGGRAPH_SERVICE_URL=http://ai-python:5002
      - CORS_ALLOWED_ORIGINS=http://localhost:8080,http://localhost:3000,http://localhost:3100
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      ai-python:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  localstackdata:
  esdata:
