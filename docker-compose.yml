services:
  # ==========================================
  # DATABASE
  # ==========================================
  db:
    image: postgres:15-alpine
    container_name: food_delivery_db
    ports:
      - "5432:5432"
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # CACHE
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: food_delivery_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped

  # ==========================================
  # SEARCH ENGINE
  # ==========================================
  elasticsearch:
    image: elasticsearch:8.10.2
    container_name: food_delivery_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    restart: unless-stopped

  # ==========================================
  # AWS LOCAL SIMULATION (SNS + SQS)
  # ==========================================
  localstack:
    image: localstack/localstack
    container_name: food_delivery_localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs,sns
      - DEFAULT_REGION=ap-southeast-1
      - EXTRA_CORS_ALLOWED_ORIGINS=https://app.localstack.cloud,http://localhost:3000,http://localhost:3001
      - EXTRA_CORS_ALLOWED_HEADERS=*
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN}
    volumes:
      - localstackdata:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/init-aws.sh
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  localstackdata:
  esdata:
