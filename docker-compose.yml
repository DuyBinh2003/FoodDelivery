services:
  # ==========================================
  # DATABASE
  # ==========================================
  db:
    image: postgres:15-alpine
    container_name: food_delivery_db
    ports:
      - "5432:5432"
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # CACHE
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: food_delivery_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped

  # ==========================================
  # SEARCH ENGINE
  # ==========================================
  elasticsearch:
    image: elasticsearch:8.10.2
    container_name: food_delivery_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    restart: unless-stopped

  # ==========================================
  # AWS LOCAL SIMULATION (SNS + SQS)
  # ==========================================
  localstack:
    image: localstack/localstack
    container_name: food_delivery_localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs,sns,s3
      - DEFAULT_REGION=ap-southeast-1
      - EXTRA_CORS_ALLOWED_ORIGINS=https://app.localstack.cloud,http://localhost:3000,http://localhost:3001
      - EXTRA_CORS_ALLOWED_HEADERS=*
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN}
    volumes:
      - localstackdata:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/init-aws.sh
    restart: unless-stopped

  # ==========================================
  # API GATEWAY
  # ==========================================
  api-gateway:
    image: nginx:alpine
    container_name: fd_api_gateway
    ports:
      - "3000:3000"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      user-service:
        condition: service_started
      admin-service:
        condition: service_started
      restaurant-service:
        condition: service_started
      order-service:
        condition: service_started
      search-service:
        condition: service_started
      payment-service:
        condition: service_started
    restart: unless-stopped

  # ==========================================
  # MICROSERVICES
  # ==========================================
  user-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        APP_NAME: user-service
    container_name: fd_user_service
    ports:
      - "3001:3001"
    env_file: ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  admin-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        APP_NAME: admin-service
    container_name: fd_admin_service
    ports:
      - "3002:3002"
    env_file: ./backend/.env
    environment:
      - USER_SERVICE_URL=http://user-service:3001
      - RESTAURANT_SERVICE_URL=http://restaurant-service:3003
      - ORDER_SERVICE_URL=http://order-service:3004
      - DELIVERY_SERVICE_URL=http://delivery-service:3005
    depends_on:
      db:
        condition: service_healthy
      localstack:
        condition: service_started
    restart: unless-stopped

  restaurant-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        APP_NAME: restaurant-service
    container_name: fd_restaurant_service
    ports:
      - "3003:3003"
    env_file: ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  order-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        APP_NAME: order-service
    container_name: fd_order_service
    ports:
      - "3004:3004"
    env_file: ./backend/.env
    environment:
      - RESTAURANT_SERVICE_URL=http://restaurant-service:3003
    depends_on:
      db:
        condition: service_healthy
      localstack:
        condition: service_started
    restart: unless-stopped

  delivery-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        APP_NAME: delivery-service
    container_name: fd_delivery_service
    ports:
      - "3005:3005"
    env_file: ./backend/.env
    environment:
      - ORDER_SERVICE_URL=http://order-service:3004
    depends_on:
      localstack:
        condition: service_started
    restart: unless-stopped

  search-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        APP_NAME: search-service
    container_name: fd_search_service
    ports:
      - "3006:3006"
    env_file: ./backend/.env
    environment:
      - RESTAURANT_SERVICE_URL=http://restaurant-service:3003
    depends_on:
      db:
        condition: service_healthy
      elasticsearch:
        condition: service_started
    restart: unless-stopped

  payment-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        APP_NAME: payment-service
    container_name: fd_payment_service
    ports:
      - "3007:3007"
    env_file: ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  localstackdata:
  esdata:
